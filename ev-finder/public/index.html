<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12654e"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><title>EV Finder</title><style>
:root{color-scheme:light dark;--bg:#f4f7f5;--card:#fff;--ink:#142a23;--muted:#52675e;--line:#dce6df;--accent:#12654e}@media(prefers-color-scheme:dark){:root{--bg:#101a16;--card:#1c2a24;--ink:#edf6ef;--muted:#a9bdb0;--line:#34483d;--accent:#12654e}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,sans-serif}main{max-width:720px;margin:auto;padding: max(20px,env(safe-area-inset-top)) 16px max(30px,env(safe-area-inset-bottom))}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:30px;margin:0}h2{font-size:19px;margin:0}p{margin:8px 0}small,.muted{color:var(--muted)}button,input,select{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}button,a{touch-action:manipulation}button{cursor:pointer}.primary,a.nav{background:var(--accent);color:white;border:0;font-weight:650}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}label{display:grid;gap:5px;font-size:13px;color:var(--muted)}label>*{width:100%;font-size:16px}.card,details.setup{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.price{font-size:27px;font-weight:750;margin-top:12px}.nav{display:block;text-align:center;text-decoration:none;padding:13px;border-radius:12px;margin-top:14px}.group{border-top:1px solid var(--line);padding-top:9px;margin-top:9px}progress{width:100%;accent-color:#258b68}summary{cursor:pointer}#status{min-height:24px} .star{font-size:22px;padding:5px 10px} .setup label{margin:12px 0}
</style></head><body><main><header><div><h1>⚡ EV Finder</h1><small>Find your next charge</small></div><button class="primary" id="refresh">↻ Refresh</button></header><details class="setup" id="setup"><summary>Connection settings</summary><label>Apps Script deployment URL<input id="endpoint" type="url" placeholder="https://script.google.com/macros/s/.../exec"></label><label>Personal access token<input id="token" type="password" autocomplete="off"></label><button id="save">Save & search</button><p><small>Stored on this device. Location is sent only when searching.</small></p></details><div class="controls"><label>Radius<select id="radius"><option>3</option><option>5</option><option selected>10</option><option>20</option><option>30</option></select></label><label>Energy (kWh)<input id="energy" type="number" min="1" max="200" value="40"></label><label>Connector<select id="connector"><option value="">All</option><option value="TESLA">NACS / Tesla</option><option value="J1772COMBO">CCS</option><option>J1772</option><option>CHADEMO</option></select></label><label>Charging<select id="speed"><option value="">All speeds</option><option value="fast">DC fast</option><option value="level2">Level 2</option></select></label><label>Sort<select id="sort"><option value="distance">Nearest</option><option value="rate">Cheapest known</option><option value="power">Fastest known</option><option value="available">Most available</option></select></label><label>Show<select id="filter"><option value="">All stations</option><option value="favorites">Favorites</option></select></label></div><p id="status" role="status">Ready</p><p id="warning" class="muted"></p><section id="results"></section><footer><small>Station data: AFDC. Availability: Google Maps. Distances are straight-line. Verify tariffs with the operator before charging.</small></footer></main><script src="app.js"></script></body></html>
